<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RSVP Dashboard | Claire & Carl</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .dashboard-shell { width: min(1200px, calc(100% - 32px)); margin: 40px auto 80px; }
    .dashboard-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; flex-wrap:wrap; }
    .dashboard-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .dashboard-actions button { width:auto; }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin:28px 0; }
    .summary-card { padding:20px; border:1px solid rgba(0,0,0,.12); border-radius:14px; background:#fff; }
    .summary-card strong { display:block; font-size:2rem; margin-top:6px; }
    .dashboard-table-wrap { overflow:auto; border:1px solid rgba(0,0,0,.12); border-radius:14px; background:#fff; }
    .dashboard-table { width:100%; border-collapse:collapse; min-width:1000px; }
    .dashboard-table th,.dashboard-table td { padding:12px 14px; text-align:left; border-bottom:1px solid rgba(0,0,0,.09); vertical-align:top; }
    .dashboard-table th { position:sticky; top:0; background:#fff; z-index:1; }
    .status-pill { display:inline-block; padding:4px 9px; border-radius:999px; font-size:.85rem; font-weight:700; }
    .status-accepted { background:#e5f6e9; }
    .status-declined { background:#fbe8e8; }
    .status-awaiting { background:#f3f0f0; }
    .admin-login { max-width:520px; margin:50px auto; }
    .dashboard-filter { margin:18px 0; }
    .dashboard-filter input { width:100%; }
    .small-action { padding:6px 10px; font-size:.85rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="index.html">C & C</a>
      <div class="nav-links">
        <a href="index.html">Website</a>
        <a href="rsvp.html">RSVP</a>
      </div>
    </nav>
  </header>

  <main class="dashboard-shell">
    <section id="admin-login" class="admin-login">
      <p class="eyebrow">Private area</p>
      <h1>RSVP dashboard</h1>
      <form id="admin-login-form" class="rsvp-form">
        <div class="form-field">
          <label for="admin-password">Dashboard password</label>
          <input id="admin-password" type="password" required>
        </div>
        <button class="submit-button" type="submit">Open dashboard</button>
        <p id="admin-error" class="password-error" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="dashboard-header">
        <div>
          <p class="eyebrow">Claire & Carl</p>
          <h1>RSVP dashboard</h1>
          <p id="last-updated"></p>
        </div>
        <div class="dashboard-actions">
          <button id="refresh-button" type="button">Refresh</button>
          <button id="export-button" type="button">Export CSV</button>
          <button id="admin-sign-out" type="button">Sign out</button>
        </div>
      </div>

      <div id="summary-grid" class="summary-grid"></div>

      <div class="dashboard-filter">
        <label for="dashboard-search">Search guests or parties</label>
        <input id="dashboard-search" type="search" placeholder="Start typing a name…">
      </div>

      <div class="dashboard-table-wrap">
        <table class="dashboard-table">
          <thead>
            <tr>
              <th>Party</th>
              <th>Invite</th>
              <th>Status</th>
              <th>Invited</th>
              <th>Attending</th>
              <th>Dietary</th>
              <th>Contact</th>
              <th>Submitted</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="dashboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_API_URL =
      "https://wedding1.carlclaireunwin.workers.dev/?action=admin-data";
    const ADMIN_CLEAR_URL =
      "https://wedding1.carlclaireunwin.workers.dev/?action=admin-clear";
    const PASSWORD_KEY = "carl-claire-dashboard-password";

    const loginSection = document.getElementById("admin-login");
    const dashboardSection = document.getElementById("dashboard");
    const loginForm = document.getElementById("admin-login-form");
    const passwordInput = document.getElementById("admin-password");
    const adminError = document.getElementById("admin-error");
    const dashboardBody = document.getElementById("dashboard-body");
    const summaryGrid = document.getElementById("summary-grid");
    const searchInput = document.getElementById("dashboard-search");

    let dashboardData = null;
    let dashboardPassword = sessionStorage.getItem(PASSWORD_KEY) || "";

    function csvEscape(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    function parseNames(value) {
      if (!value || value === "None") return [];
      return value.split(",").map(name => name.trim()).filter(Boolean);
    }

    function submissionMap() {
      return new Map(
        dashboardData.submissions.map(item => [item.party, item])
      );
    }

    function buildRows() {
      const responses = submissionMap();

      return dashboardData.invitations.map(invitation => {
        const response = responses.get(invitation.party);
        const invitedNames = invitation.guests.map(guest => guest.name);
        const attendingNames = response ? parseNames(response.guestsAttending) : [];

        return {
          party: invitation.party,
          inviteType: invitation.inviteType,
          invitedNames,
          invitedAdults: invitation.guests.filter(g => g.personType !== "Child").length,
          invitedChildren: invitation.guests.filter(g => g.personType === "Child").length,
          response,
          attendingNames,
          attendingAdults: invitation.guests.filter(
            g => g.personType !== "Child" && attendingNames.includes(g.name)
          ).length,
          attendingChildren: invitation.guests.filter(
            g => g.personType === "Child" && attendingNames.includes(g.name)
          ).length
        };
      });
    }

    function statusFor(row) {
      if (!row.response) return "Awaiting";
      return row.response.attending === "Yes" ? "Accepted" : "Declined";
    }

    function renderSummary(rows) {
      const responded = rows.filter(row => row.response).length;
      const accepted = rows.filter(row => statusFor(row) === "Accepted");
      const declined = rows.filter(row => statusFor(row) === "Declined");
      const awaiting = rows.length - responded;

      const attendingAdults = accepted.reduce(
        (total, row) => total + row.attendingAdults, 0
      );
      const attendingChildren = accepted.reduce(
        (total, row) => total + row.attendingChildren, 0
      );
      const dayGuests = accepted
        .filter(row => row.inviteType === "Day")
        .reduce((total, row) => total + row.attendingNames.length, 0);
      const eveningOnly = accepted
        .filter(row => row.inviteType === "Evening")
        .reduce((total, row) => total + row.attendingNames.length, 0);

      const cards = [
        ["Replies", `${responded}/${rows.length}`],
        ["Awaiting", awaiting],
        ["Accepted parties", accepted.length],
        ["Declined parties", declined.length],
        ["Day guests attending", dayGuests],
        ["Evening guests attending", eveningOnly],
        ["Adults attending", attendingAdults],
        ["Children attending", attendingChildren]
      ];

      summaryGrid.innerHTML = cards.map(([label, value]) => `
        <div class="summary-card">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function renderTable(rows) {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = rows.filter(row => {
        const searchable = [
          row.party,
          row.inviteType,
          ...row.invitedNames,
          ...(row.attendingNames || [])
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      dashboardBody.innerHTML = filtered.map(row => {
        const status = statusFor(row);
        const statusClass =
          status === "Accepted"
            ? "status-accepted"
            : status === "Declined"
              ? "status-declined"
              : "status-awaiting";

        const contact = row.response
          ? [row.response.email, row.response.phone].filter(Boolean).join("<br>")
          : "—";

        const submitted = row.response?.submittedAt
          ? new Date(row.response.submittedAt).toLocaleString("en-GB")
          : "—";

        const clearButton = row.response
          ? `<button class="small-action clear-response" data-party="${row.party.replaceAll('"', '&quot;')}">Clear</button>`
          : "";

        return `
          <tr>
            <td><strong>${row.party}</strong></td>
            <td>${row.inviteType}</td>
            <td><span class="status-pill ${statusClass}">${status}</span></td>
            <td>${row.invitedNames.join("<br>")}</td>
            <td>${row.attendingNames.length ? row.attendingNames.join("<br>") : "—"}</td>
            <td>${row.response?.dietaryRequirements || "—"}</td>
            <td>${contact}</td>
            <td>${submitted}</td>
            <td>${clearButton}</td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll(".clear-response").forEach(button => {
        button.addEventListener("click", async () => {
          const party = button.dataset.party;

          if (!confirm(`Clear the RSVP for ${party}?`)) return;

          const response = await fetch(ADMIN_CLEAR_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${dashboardPassword}`
            },
            body: JSON.stringify({ party })
          });

          if (!response.ok) {
            alert("The response could not be cleared.");
            return;
          }

          await loadDashboard();
        });
      });
    }

    function renderDashboard() {
      const rows = buildRows();
      renderSummary(rows);
      renderTable(rows);
      document.getElementById("last-updated").textContent =
        `Last refreshed ${new Date().toLocaleString("en-GB")}`;
    }

    async function loadDashboard() {
      const response = await fetch(ADMIN_API_URL, {
        headers: {
          "Authorization": `Bearer ${dashboardPassword}`
        },
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Unauthorised");
      }

      dashboardData = await response.json();
      loginSection.hidden = true;
      dashboardSection.hidden = false;
      renderDashboard();
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      adminError.textContent = "";
      dashboardPassword = passwordInput.value;

      try {
        await loadDashboard();
        sessionStorage.setItem(PASSWORD_KEY, dashboardPassword);
      } catch {
        adminError.textContent = "The dashboard password is incorrect.";
      }
    });

    searchInput.addEventListener("input", () => {
      if (dashboardData) renderTable(buildRows());
    });

    document.getElementById("refresh-button").addEventListener("click", loadDashboard);

    document.getElementById("admin-sign-out").addEventListener("click", () => {
      sessionStorage.removeItem(PASSWORD_KEY);
      location.reload();
    });

    document.getElementById("export-button").addEventListener("click", () => {
      const rows = buildRows();

      const headings = [
        "Party", "Invite type", "Status", "Invited guests",
        "Guests attending", "Adults attending", "Children attending",
        "Dietary requirements", "Email", "Phone", "Message", "Submitted"
      ];

      const csvRows = rows.map(row => [
        row.party,
        row.inviteType,
        statusFor(row),
        row.invitedNames.join(", "),
        row.attendingNames.join(", "),
        row.attendingAdults,
        row.attendingChildren,
        row.response?.dietaryRequirements || "",
        row.response?.email || "",
        row.response?.phone || "",
        row.response?.message || "",
        row.response?.submittedAt || ""
      ]);

      const csv = [
        headings.map(csvEscape).join(","),
        ...csvRows.map(row => row.map(csvEscape).join(","))
      ].join("\r\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `wedding-rsvps-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    if (dashboardPassword) {
      loadDashboard().catch(() => {
        sessionStorage.removeItem(PASSWORD_KEY);
        dashboardPassword = "";
      });
    }
  </script>
</body>
</html>
